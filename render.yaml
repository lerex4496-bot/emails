services:
  - type: web
    name: mailtrace-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm --filter @mailtrace/database prisma:push && node services/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        value: none
      - key: DATABASE_URL
        sync: false
