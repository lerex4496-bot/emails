services:
  - type: web
    name: mailtrace-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:api
    startCommand: node services/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mailtrace-db
          property: connectionString
      - key: REDIS_URL
        value: none

databases:
  - name: mailtrace-db
    plan: free
