services:
  - type: web
    name: mailtrace-api
    runtime: docker
    dockerfilePath: infrastructure/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mailtrace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailtrace-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRACKING_BASE_URL
        sync: false

  - type: worker
    name: mailtrace-worker
    runtime: docker
    dockerfilePath: infrastructure/Dockerfile.worker
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mailtrace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailtrace-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: mailtrace-api
          envVarKey: ENCRYPTION_KEY

databases:
  - name: mailtrace-db
    plan: starter
    databaseName: mailtrace
    user: mailtrace
    region: oregon

  - name: mailtrace-redis
    type: redis
    plan: starter
    region: oregon
    ipAllowList: []
