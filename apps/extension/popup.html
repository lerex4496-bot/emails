<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MailTrace Companion</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #34d399;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>MailTrace Companion</span>
  </div>
  <p>Status: <span class="status">Active & Connected</span></p>
  <p style="color: #94a3b8; font-size: 11px;">
    Emits confirmed view telemetry when you view tracked threads in Gmail and Outlook Web.
  </p>
</body>
</html>
