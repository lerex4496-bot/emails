<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MailTrace Webmail Companion</title>
  <style>
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .title {
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .badge-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #34d399;
    }
    .badge-status.offline {
      background: #451a03;
      color: #fb923c;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    input[type="text"]:focus, input[type="url"]:focus {
      border-color: #38bdf8;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
      cursor: pointer;
    }
    .checkbox-row input {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
    }
    .footer-link:hover {
      text-decoration: underline;
    }
    #msg-alert {
      margin-top: 8px;
      font-size: 11px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡</span>
      <span>MailTrace Companion</span>
    </div>
    <span id="status-indicator" class="badge-status">Checking...</span>
  </div>

  <div class="field">
    <label for="api-url">API Endpoint URL</label>
    <input type="url" id="api-url" placeholder="https://mailtrace-api.onrender.com" />
  </div>

  <div class="field">
    <label for="dashboard-url">Vercel Dashboard URL</label>
    <input type="url" id="dashboard-url" placeholder="https://emails-web-mu.vercel.app" />
  </div>

  <label class="checkbox-row">
    <input type="checkbox" id="auto-track" checked />
    <span>Enable tracking by default in Gmail</span>
  </label>

  <div class="actions">
    <button id="btn-save" class="btn-primary">Save Settings</button>
    <button id="btn-test" class="btn-secondary">Test Connection</button>
  </div>

  <div id="msg-alert"></div>

  <a href="#" id="link-dashboard" class="footer-link">Open MailTrace Web Dashboard ↗</a>

  <script src="popup.js"></script>
</body>
</html>
